<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="860" height="320" rx="18" fill="url(#bg)"/>
  <text x="430" y="38" text-anchor="middle" fill="#f1f5f9" font-size="20" font-weight="700">PillWise Architecture</text>

  <rect x="40" y="80" width="200" height="110" rx="14" fill="rgba(14,165,233,0.12)" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="140" y="118" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">Next.js 16</text>
  <text x="140" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">React + Tailwind v4</text>
  <text x="140" y="158" text-anchor="middle" fill="#94a3b8" font-size="11">Vercel (frontend)</text>
  <text x="140" y="176" text-anchor="middle" fill="#64748b" font-size="10">PWA · i18n · Charts</text>

  <rect x="330" y="80" width="200" height="110" rx="14" fill="rgba(99,102,241,0.12)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="430" y="118" text-anchor="middle" fill="#a5b4fc" font-size="14" font-weight="700">ASP.NET Core 10</text>
  <text x="430" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">Web API · JWT · BCrypt</text>
  <text x="430" y="158" text-anchor="middle" fill="#94a3b8" font-size="11">Swagger · Serilog · RL</text>
  <text x="430" y="176" text-anchor="middle" fill="#64748b" font-size="10">xUnit tests · CI</text>

  <rect x="620" y="80" width="200" height="110" rx="14" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
  <text x="720" y="118" text-anchor="middle" fill="#34d399" font-size="14" font-weight="700">SQL Server</text>
  <text x="720" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">EF Core ORM</text>
  <text x="720" y="158" text-anchor="middle" fill="#94a3b8" font-size="11">79 medicines · 45 interactions</text>
  <text x="720" y="176" text-anchor="middle" fill="#64748b" font-size="10">users · families · warnings</text>

  <line x1="240" y1="135" x2="326" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="135" x2="616" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="283" y="124" text-anchor="middle" fill="#64748b" font-size="10">REST/JSON</text>
  <text x="573" y="124" text-anchor="middle" fill="#64748b" font-size="10">EF Core</text>

  <rect x="290" y="230" width="280" height="50" rx="12" fill="rgba(148,163,184,0.08)" stroke="rgba(148,163,184,0.35)" stroke-dasharray="4 3"/>
  <text x="430" y="260" text-anchor="middle" fill="#94a3b8" font-size="12">Built spec-first with Kiro · Docker compose ready · GitHub Actions CI</text>

  <text x="430" y="308" text-anchor="middle" fill="#475569" font-size="11">💊 PillWise — Be Wise Before You Take · Islamabad Hack 2026</text>
